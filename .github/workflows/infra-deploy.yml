name: Infra deploy

on:
  push:
    branches:
      - main
    # Scripts under infra/ (bootstrap and local deploy) are not part of the deployed template.
    paths:
      - 'infra/**'
      - '!infra/**/*.ps1'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled halfway.
concurrency:
  group: infra-deploy
  cancel-in-progress: false

env:
  TEMPLATE_FILE: infra/workload/main.bicep

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the template
        run: az bicep build --file "$TEMPLATE_FILE" --stdout > /dev/null

      - name: Lint the template
        run: az bicep lint --file "$TEMPLATE_FILE"

      - name: Build the parameter files
        run: |
          az bicep build-params --file infra/workload/workload.test.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/workload/workload.prod.bicepparam --stdout > /dev/null

  deploy-test:
    name: Deploy test
    needs: lint
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT_NAME: test
      PARAMETER_FILE: infra/workload/workload.test.bicepparam
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --validation-level Provider \
            --no-pretty-print \
            --output json > whatif.json
          {
            echo "### What-if for ${ENVIRONMENT_NAME}"
            echo
            echo '| Change | Count |'
            echo '| --- | --- |'
            jq -r '.changes | group_by(.changeType) | .[] | "| \(.[0].changeType) | \(length) |"' whatif.json
            echo
            echo '```'
            jq -r '.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore") | "\(.changeType)\t\(.resourceId)"' whatif.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.changes | any(.changeType == "Delete")' whatif.json > /dev/null; then
            echo '::error::The what-if contains a Delete. Stopping: this template must not delete anything.'
            exit 1
          fi

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "workload-${ENVIRONMENT_NAME}-${GITHUB_RUN_NUMBER}" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --output none

  deploy-prod:
    name: Deploy prod
    needs: deploy-test
    # The prod environment also requires a reviewer; the branch check keeps manual dispatches from other branches out.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT_NAME: prod
      PARAMETER_FILE: infra/workload/workload.prod.bicepparam
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --validation-level Provider \
            --no-pretty-print \
            --output json > whatif.json
          {
            echo "### What-if for ${ENVIRONMENT_NAME}"
            echo
            echo '| Change | Count |'
            echo '| --- | --- |'
            jq -r '.changes | group_by(.changeType) | .[] | "| \(.[0].changeType) | \(length) |"' whatif.json
            echo
            echo '```'
            jq -r '.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore") | "\(.changeType)\t\(.resourceId)"' whatif.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.changes | any(.changeType == "Delete")' whatif.json > /dev/null; then
            echo '::error::The what-if contains a Delete. Stopping: this template must not delete anything.'
            exit 1
          fi

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "workload-${ENVIRONMENT_NAME}-${GITHUB_RUN_NUMBER}" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --output none
